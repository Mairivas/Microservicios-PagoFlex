server.port=8080
spring.application.name=api-gateway
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

jwt.secret=PagoFlexSecretKeyParaJwtConMinimo256BitsDeLargo1234567890

spring.cloud.gateway.routes[0].id=auth-public
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.routes[1].id=auth-protected
spring.cloud.gateway.routes[1].uri=lb://auth-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/usuarios/**,/api/comunas/**

spring.cloud.gateway.routes[2].id=compromisos
spring.cloud.gateway.routes[2].uri=lb://compromisos-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/compromisos/**

spring.cloud.gateway.routes[3].id=pagos
spring.cloud.gateway.routes[3].uri=lb://pagos-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/pagos/**

spring.cloud.gateway.routes[4].id=soporte
spring.cloud.gateway.routes[4].uri=lb://soporte-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/reportes/**

